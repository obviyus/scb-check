---
id: ts-catch-static-fallback
language: TypeScript
severity: warning
message: "This catch returns an empty fallback for every error. Review whether callers can distinguish failure from valid empty data; handle a specific error, report it, or let it propagate."
metadata:
  weight: 6
  category: slop
rule:
  kind: catch_clause
  has:
    field: body
    pattern: '{ return $VALUE; }'
constraints:
  VALUE:
    any:
      - pattern: 'null'
      - pattern: 'false'
      - pattern: 'true'
      - pattern: '0'
      - pattern: '""'
      - pattern: '[]'
      - pattern:
          context: 'const empty = {};'
          selector: object
---
id: ts-empty-catch
language: TypeScript
severity: warning
message: "This catch discards every error. Review the expected failure and record why it can be ignored."
metadata:
  weight: 6
  category: slop
rule:
  kind: catch_clause
  has:
    field: body
    pattern: '{}'
---
id: ts-rethrow-only-catch
language: TypeScript
severity: warning
message: "This catch only rethrows the same error. Remove the redundant catch while preserving any finally block."
metadata:
  weight: 5
  category: slop
rule:
  pattern:
    context: 'try { work(); } catch ($ERR) { throw $ERR; }'
    selector: catch_clause
---
id: ts-boolean-ternary
language: TypeScript
severity: warning
message: "This conditional only produces a boolean. Use an explicit boolean conversion or negation; preserve truthiness semantics."
metadata:
  weight: 5
  category: slop
rule:
  any:
    - pattern: '$COND ? true : false'
    - pattern: '$COND ? false : true'
---
id: ts-boolean-return
language: TypeScript
severity: warning
message: "Both branches return boolean literals. Return an explicit boolean conversion or negation of the condition."
metadata:
  weight: 5
  category: slop
rule:
  any:
    - pattern: 'if ($COND) { return true; } else { return false; }'
    - pattern: 'if ($COND) { return false; } else { return true; }'
---
id: ts-identical-ternary-branches
language: TypeScript
severity: warning
message: "Both branches produce the same expression. Review the redundant conditional and preserve any side effects in its condition."
metadata:
  weight: 5
  category: slop
rule:
  pattern: '$COND ? $VALUE : $VALUE'
---
id: ts-nested-if
language: TypeScript
severity: info
message: "The outer if contains only another if. Consider combining the conditions with && to reduce nesting."
metadata:
  weight: 1
  category: slop
rule:
  all:
    - pattern: 'if ($OUTER) { if ($INNER) { $$$BODY } }'
    - not:
        has:
          field: alternative
          kind: else_clause
    - has:
        field: consequence
        has:
          kind: if_statement
          not:
            has:
              field: alternative
              kind: else_clause
---
id: ts-double-assertion
language: TypeScript
severity: warning
message: "A double assertion bypasses assignability checks. Review the producer and consumer types or validate the value at its input boundary."
metadata:
  weight: 6
  category: slop
rule:
  any:
    - pattern: '$VALUE as unknown as $TYPE'
    - pattern: '$VALUE as any as $TYPE'
---
id: ts-explicit-any
language: TypeScript
severity: info
message: "An explicit any disables type checking here. Review whether a domain type or boundary validation can preserve the contract."
metadata:
  weight: 1
  category: slop
rule:
  kind: predefined_type
  regex: '^any$'
---
id: ts-non-null-assertion
language: TypeScript
severity: info
message: "A non-null assertion bypasses a nullability check. Review whether the type can express this invariant or the boundary should validate it."
metadata:
  weight: 1
  category: slop
rule:
  kind: non_null_expression
